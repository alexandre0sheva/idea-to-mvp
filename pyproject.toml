[project]
name = "idea-to-mvp"
version = "0.3.0"
description = "Turn a product idea into a built, tested first version: a multi-LLM panel, human gates, a blueprint pack, and sandboxed Claude agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksandr Shevchenko" }]
keywords = ["ai-agents", "llm", "langgraph", "claude-agent-sdk", "gradio", "mcp", "code-generation", "multi-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gradio>=6.29",
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-openai>=1.6",
  "langchain-anthropic>=1.7",
  "langchain-google-genai>=4.4",
  "pydantic-settings>=2.15",
  "python-dotenv>=1.0",
  "markdown>=3.7",
  "claude-agent-sdk>=0.2.162",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "aiosqlite>=0.22.1",
]

[project.urls]
Homepage = "https://github.com/alexandre0sheva/idea-to-mvp"
Repository = "https://github.com/alexandre0sheva/idea-to-mvp"
Issues = "https://github.com/alexandre0sheva/idea-to-mvp/issues"
Changelog = "https://github.com/alexandre0sheva/idea-to-mvp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# `idea-to-mvp mcp`. claude-agent-sdk already installs mcp; the extra pins the 2.x API the server is written for.
mcp = ["mcp>=2.3"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-Markdown",
]

[project.scripts]
idea-to-mvp = "idea_to_mvp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_to_mvp"]

# An allowlist: hatch honours only the repository's .gitignore, so a file a developer ignores globally (the
# per-user `.claude/settings.local.json`, editor folders) would otherwise ship in the sdist.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/.github",
  "/.env.example",
  "/.pre-commit-config.yaml",
  "/CHANGELOG.md",
  "/CLAUDE.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The starter templates are data for other projects (placeholders and all), not code of this one.
extend-exclude = ["src/idea_to_mvp/templates/*/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",
  "RUF001", "RUF002", "RUF003",  # the docs and prompts use typographic dashes and quotes on purpose
  "RUF005", "RUF007", "RUF059",  # stylistic: list concatenation, zip(a, a[1:]), unused unpacked names
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
  "live: calls real provider APIs (deselected by default; run with `pytest -m live`)",
  "scaffold: installs and checks each starter template with the real toolchain and network (deselected by default; run with `pytest -m scaffold`)",
]
addopts = "-m 'not live and not scaffold'"

[tool.coverage.run]
source = ["idea_to_mvp"]
branch = false

[tool.coverage.report]
# Enforced when coverage is asked for (`pytest --cov`, as CI does); plain and partial test runs are not gated.
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["tests/", "\\.venv/", "src/idea_to_mvp/templates/.*/files/"]

# The model-facing core is checked strictly: it is where a silent Any or a missing annotation hides a bug.
[[tool.mypy.overrides]]
module = ["idea_to_mvp.llm.*", "idea_to_mvp.schemas", "idea_to_mvp.plan"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true

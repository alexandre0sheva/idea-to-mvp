# What each profile (`MODEL_PROFILE`) puts on every role that has its own model settings. Roles that share the
# architect's settings (strategy, plan writer, change planner, blueprint critic) follow the `architect` row.
# The provider of a role is the provider of the model named here.

[profiles.fast]
pm = "gpt-6-luna"
tech_lead = "claude-haiku-5-5"
skeptic = "gemini-3.8-flash"
summarizer = "claude-haiku-5-5"
architect = "claude-haiku-5-5"
moderator = "claude-haiku-5-5"
research = "claude-haiku-5-5"

[profiles.balanced]
pm = "gpt-6.1-sol"
tech_lead = "claude-sonnet-5-5"
skeptic = "gemini-3.8-flash"
summarizer = "claude-sonnet-5-5"
architect = "claude-sonnet-5-5"
moderator = "claude-haiku-5-5"
research = "claude-sonnet-5-5"

[profiles.quality]
pm = "gpt-6.1-sol"
tech_lead = "claude-opus-5-5"
skeptic = "gemini-3.8-flash"
summarizer = "claude-opus-5-5"
architect = "claude-opus-5-5"
moderator = "claude-haiku-5-5"
research = "claude-sonnet-5-5"  # searching and condensing, not deep reasoning

# The shape of a typical run, for `idea-to-mvp models`: how many calls a role makes and how many tokens each call
# reads and writes. These are planning assumptions (a three-round panel, a three-task plan), not measurements;
# `cached_fraction` is the share of input tokens served from the provider's prompt cache. Optional steps
# (the research step) are left out. `implementer` is every agent session: three task sessions and three lanes.

[typical_run.pm]
calls = 3
input_tokens = 4000
output_tokens = 600

[typical_run.tech_lead]
calls = 3
input_tokens = 4000
output_tokens = 600

[typical_run.skeptic]
calls = 3
input_tokens = 4000
output_tokens = 800

[typical_run.moderator]
calls = 9
input_tokens = 3000
output_tokens = 150

[typical_run.summarizer]
calls = 1
input_tokens = 8000
output_tokens = 1500

[typical_run.architect]
calls = 12
input_tokens = 10000
output_tokens = 3500

[typical_run.implementer]
calls = 6
input_tokens = 300000
output_tokens = 25000
cached_fraction = 0.8

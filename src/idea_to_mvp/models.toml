# What each profile (`MODEL_PROFILE`) puts on every role that has its own model settings. Roles that share the
# architect's settings (strategy, plan writer, change planner, blueprint critic) follow the `architect` row.
# The provider of a role is the provider of the model named here. `implementer`, `verifier`, and `escalation` are
# the agent sessions (Claude Agent SDK): task sessions; the read-mostly verification lanes; the merge resolver
# and every fix attempt after the first. Why each choice: the *Model choices* table in docs/architecture.md.

[profiles.fast]  # the cheapest current models; escalation one tier up, so a retry is not the same model again
pm = "gpt-6-luna"
tech_lead = "claude-haiku-5-5"
skeptic = "gemini-3.8-flash"  # the current Flash keeps a third provider in the debate
summarizer = "claude-haiku-5-5"
architect = "claude-haiku-5-5"
moderator = "claude-haiku-5-5"
research = "claude-haiku-5-5"
implementer = "claude-haiku-5-5"
verifier = "claude-haiku-5-5"
escalation = "claude-sonnet-5-5"

[profiles.balanced]  # the default: the best value per role
pm = "gpt-6.1-sol"
tech_lead = "claude-sonnet-5-5"
skeptic = "gemini-3.8-flash"
summarizer = "claude-sonnet-5-5"
architect = "claude-opus-5-5"  # planning mistakes are paid for again in every agent session
moderator = "claude-haiku-5-5"
research = "claude-sonnet-5-5"
implementer = "claude-sonnet-5-5"
verifier = "claude-sonnet-5-5"
escalation = "claude-opus-5-5"

[profiles.quality]  # frontier models where they change the outcome
pm = "gpt-6.1-sol"
tech_lead = "claude-opus-5-5"
skeptic = "gemini-3.8-flash"
summarizer = "claude-opus-5-5"
architect = "claude-opus-5-5"
moderator = "claude-haiku-5-5"
research = "claude-sonnet-5-5"  # searching and condensing, not deep reasoning
implementer = "claude-opus-5-5"
verifier = "claude-opus-5-5"
escalation = "claude-fable-5-1"

# The shape of a typical run, for `idea-to-mvp models`: how many calls a role makes and how many tokens each call
# reads and writes. These are planning assumptions (a three-round panel, a three-task plan), not measurements;
# `cached_fraction` is the share of input tokens served from the provider's prompt cache. Optional steps (the
# research step) and escalated sessions (a merge conflict, a second fix attempt) are left out.

[typical_run.pm]
calls = 3
input_tokens = 4000
output_tokens = 600

[typical_run.tech_lead]
calls = 3
input_tokens = 4000
output_tokens = 600

[typical_run.skeptic]
calls = 3
input_tokens = 4000
output_tokens = 800

[typical_run.moderator]
calls = 9
input_tokens = 3000
output_tokens = 150

[typical_run.summarizer]
calls = 1
input_tokens = 8000
output_tokens = 1500

[typical_run.architect]
calls = 12
input_tokens = 10000
output_tokens = 3500

[typical_run.implementer]  # three task sessions, plus one fix attempt
calls = 4
input_tokens = 300000
output_tokens = 25000
cached_fraction = 0.8

[typical_run.verifier]  # three lanes: reading code and running checks, short reports
calls = 3
input_tokens = 150000
output_tokens = 6000
cached_fraction = 0.8

# The model catalog: the one place that knows which models exist, what they cost, and what they can do.
# Read by `model_catalog.py` (validated on load); `idea-to-mvp models` prints it and `idea-to-mvp models --check`
# compares it with what each provider lists today.
#
# Prices are USD per million tokens (standard tier, no batch or priority discount). A model without a price is
# "unpriced": it still works, but cost figures leave it out. `checked` is the day the row was verified against
# `source`; refresh both together.

[[models]]
id = "gpt-6-luna"
provider = "openai"
tier = "fast"
input_per_mtok = 0.10
output_per_mtok = 0.50
cached_input_per_mtok = 0.01
context_window = 1050000
max_output = 128000
structured_output = true
sampling = false
web_search = true
checked = 2026-10-19
source = "https://developers.openai.com/api/docs/models/gpt-6-luna"
notes = "Prompts over 272K input tokens cost $0.20 in / $0.75 out. Reasoning model: sampling parameters are not sent."


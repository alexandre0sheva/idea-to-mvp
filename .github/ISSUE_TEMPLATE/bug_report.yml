name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste API keys, tokens, or the contents of `.env`.** Redact them from any log you attach.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or the clicks, the idea you used, and the gate or stage where it went wrong. Does `DEMO_MODE=true` show it too?
      placeholder: |
        1. DEMO_MODE=true uv run idea-to-mvp run "a habit tracker" --autopilot
        2. ...
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Version and setup
      description: The output of `idea-to-mvp doctor --offline`, and the idea-to-mvp version, Python version, and OS. It lists settings and model names, never key values.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: The terminal output, or the file from the run's `.idea-to-mvp/trajectories/` folder if an agent session misbehaved.
      render: text
